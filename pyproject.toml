[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpg-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "llama-cpp-python>=0.3.16",
    "numpy>=2.0",
]

[project.scripts]
game = "rpg_ai.__main__:main"

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "snakeviz",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "ARG", "SIM", "B"]
ignore = [
    # Deliberate: the LLM output filter needs the real unicode dash/quote ranges it strips.
    "RUF001",
    "RUF002",
    "RUF003",
    # The constants modules are nothing but class-level tables; ClassVar on each says nothing.
    "RUF012",
]

[tool.uv]
package = true
